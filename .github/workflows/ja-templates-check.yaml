# Keeps the Japanese PrivacyMark document templates usable by ja-docgen:
# every 【variable】 must be defined and every conditional block balanced.
name: "ja-templates-check"
on:
  push:
    branches:
      - "main"
  pull_request:
    paths:
      - "docs/ja/templates/**"
      - "cmd/ja-docgen/**"
      - ".github/workflows/ja-templates-check.yaml"

permissions:
  contents: "read"

jobs:
  check:
    name: "check document templates"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v6
        with:
          persist-credentials: false
      - uses: "actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e" # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: false
      - name: "Test ja-docgen"
        run: "go test ./cmd/ja-docgen"
      - name: "Check templates"
        run: "go run ./cmd/ja-docgen -check"
