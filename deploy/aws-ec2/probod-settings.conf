#
# probod settings for https://grc.michisuu.com, used as the env_file of the
# probo service. No secrets in this file: values starting with awsps:// are
# read from AWS SSM Parameter Store by probod-bootstrap at container start,
# using the EC2 instance role. The Postgres password is injected by
# compose.yaml from the host-only runtime.conf.

AWS_REGION=ap-northeast-1

# --- Secrets (SSM Parameter Store, SecureString) ---
PROBOD_ENCRYPTION_KEY=awsps:///opengrc/encryption-key
PROBOD_AUTH_COOKIE_SECRET=awsps:///opengrc/auth-cookie-secret
PROBOD_AUTH_PASSWORD_PEPPER=awsps:///opengrc/auth-password-pepper
PROBOD_OAUTH2_SERVER_SIGNING_KEY=awsps:///opengrc/oauth2-signing-key
PROBOD_SAML_CERTIFICATE=awsps:///opengrc/saml-certificate
PROBOD_SAML_PRIVATE_KEY=awsps:///opengrc/saml-private-key
PROBOD_SMTP_USER=awsps:///opengrc/smtp-user
PROBOD_SMTP_PASSWORD=awsps:///opengrc/smtp-password

# Google Workspace sign-in. Uncomment after the OAuth client exists and
# both parameters are stored (README.md, "Google ログイン").
# PROBOD_AUTH_GOOGLE_CLIENT_ID=awsps:///opengrc/google-client-id
# PROBOD_AUTH_GOOGLE_CLIENT_SECRET=awsps:///opengrc/google-client-secret

# --- URLs and listeners ---
PROBOD_BASE_URL=https://grc.michisuu.com
PROBOD_API_ADDR=:8080
PROBOD_API_CORS_ALLOWED_ORIGINS=https://grc.michisuu.com
PROBOD_METRICS_ADDR=localhost:8081
# probod cannot disable trace export; Caddy accepts and discards them.
PROBOD_TRACING_ADDR=caddy:4318

# --- Auth ---
PROBOD_AUTH_COOKIE_DOMAIN=grc.michisuu.com
PROBOD_AUTH_COOKIE_SECURE=true
# Password sign-up is closed; people join through invitations or Google.
PROBOD_AUTH_DISABLE_SIGNUP=true

# --- Database (password comes from compose.yaml) ---
PROBOD_PG_ADDR=postgres:5432
PROBOD_PG_USERNAME=probod
PROBOD_PG_DATABASE=probod
PROBOD_PG_POOL_SIZE=20

# --- File storage: real S3, credentials from the instance role ---
PROBOD_AWS_REGION=ap-northeast-1
PROBOD_AWS_BUCKET=michisuu-opengrc-files
PROBOD_AWS_USE_PATH_STYLE=false

# --- PDF rendering ---
PROBOD_CHROME_DP_ADDR=chrome:9222

# --- Email (Amazon SES SMTP, STARTTLS on 587) ---
PROBOD_SMTP_ADDR=email-smtp.ap-northeast-1.amazonaws.com:587
PROBOD_SMTP_TLS_REQUIRED=true
PROBOD_SMTP_HELLO_NAME=grc.michisuu.com
PROBOD_MAILER_SENDER_EMAIL=no-reply@michisuu.com
PROBOD_MAILER_SENDER_NAME=MICHISUU GRC

# --- Compliance portal: not exposed in the in-house setup ---
PROBOD_TRUST_CENTER_TLS_MODE=external
PROBOD_TRUST_CENTER_HTTP_ADDR=:8090
PROBOD_TRUST_CENTER_BASE_DOMAIN=portal.grc.michisuu.com
PROBOD_CUSTOM_DOMAINS_CNAME_TARGET=portal.grc.michisuu.com

# --- AI features are not used. probod needs a provider to start, so a
# placeholder key is set. Do not use AI features: they would send data
# to OpenAI and fail authentication. ---
PROBOD_OPENAI_API_KEY=disabled
