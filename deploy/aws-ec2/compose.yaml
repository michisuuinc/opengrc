#
# Single-host production stack for the in-house environment
# (https://grc.michisuu.com). See README.md.
#
# - Only Caddy publishes ports (80/443).
# - Networks are split by role so a compromised container cannot reach
#   the others: edge (caddy <-> probo), db (probo <-> postgres, no
#   internet), render (probo <-> chrome).
# - probo has fixed addresses: imds-guard.sh lets only those reach the EC2
#   instance metadata service (and so the instance role credentials).
# - Secrets for probod are AWS SSM Parameter Store references resolved by
#   probod-bootstrap. The image and Postgres passwords come from
#   runtime.conf, which fetch-secrets.sh writes on the host
#   (docker compose --env-file runtime.conf).
# - Container logs go to CloudWatch Logs (/opengrc/containers).

name: "opengrc"

x-logging: &logging
  driver: "awslogs"
  options:
    awslogs-region: "ap-northeast-1"
    awslogs-group: "/opengrc/containers"
    awslogs-create-group: "false"
    tag: "{{.Name}}"

services:
  caddy:
    image: "caddy:2.10.2@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb"
    restart: "unless-stopped"
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    networks:
      - "edge"
    volumes:
      - "./Caddyfile:/etc/caddy/Caddyfile:ro"
      - "caddy-data:/data"
      - "caddy-config:/config"
    depends_on:
      - "probo"

  probo:
    image: "${PROBOD_IMAGE:?run fetch-secrets.sh first}"
    restart: "unless-stopped"
    logging: *logging
    env_file:
      - "probod-settings.conf"
    environment:
      PROBOD_PG_PASSWORD: "${PROBOD_PG_PASSWORD:?run fetch-secrets.sh first}"
    networks:
      edge:
        ipv4_address: "172.30.0.10"
      db: {}
      render:
        ipv4_address: "172.30.2.10"
    volumes:
      - "probo-data:/data"
    depends_on:
      postgres:
        condition: "service_healthy"
      chrome:
        condition: "service_started"

  postgres:
    image: "postgres@sha256:52e6ffd11fddd081ae63880b635b2a61c14008c17fc98cdc7ce5472265516dd0"
    restart: "unless-stopped"
    logging: *logging
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?run fetch-secrets.sh first}"
      PROBOD_PG_PASSWORD: "${PROBOD_PG_PASSWORD:?run fetch-secrets.sh first}"
      TRUST_CENTER_BASE_DOMAIN: "portal.grc.michisuu.com"
    networks:
      - "db"
    volumes:
      - "postgres-data:/var/lib/postgresql"
      - "./postgres-init.sh:/docker-entrypoint-initdb.d/01_probod.sh:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d probod"]
      interval: "5s"
      timeout: "5s"
      retries: 12

  chrome:
    image: "chromedp/headless-shell@sha256:b24482ae166e2c67135f5a8ba9575c257efdd8e2fd6b2e931f9d88ede3d72f3b"
    restart: "unless-stopped"
    logging: *logging
    shm_size: "1gb"
    networks:
      - "render"

networks:
  edge:
    ipam:
      config:
        - subnet: "172.30.0.0/24"
  db:
    internal: true
    ipam:
      config:
        - subnet: "172.30.1.0/24"
  render:
    ipam:
      config:
        - subnet: "172.30.2.0/24"

volumes:
  caddy-data:
  caddy-config:
  probo-data:
  postgres-data:
