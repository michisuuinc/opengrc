#
# ja-docgen の設定ファイルの例です。架空の会社の値を入れています。
# このリポジトリの外（社内の private リポジトリなど）にコピーし、自社の値に
# 書き換えて、次のように実行します。
#
#   go run ./cmd/ja-docgen -config ../社内/自社.yaml -out ../社内/完成版
#
# ツールは、このリポジトリの中の設定ファイル（このファイルを除く）や出力先を
# 受け付けません。自社の値と完成版を誤ってコミットしないためです。
# 項目の一覧と既定値は variables.md を参照してください。

会社:
  会社名: 株式会社サンプル
  代表者の役職: 代表取締役
  代表者氏名: 山田 太郎
  郵便番号: 100-0001
  所在地: 東京都千代田区千代田 1-1
  事業の内容: ソフトウェアの開発とシステム運用支援
  問合せ窓口: 個人情報保護窓口
  電話番号: 03-0000-0000
  メールアドレス: privacy@example.co.jp
  公表ページのURL: https://www.example.co.jp/privacy/
  # 事務所の仕切りが「なし」の例。管理区域は書庫・キャビネットそのもの、取扱区域は事務所全体です。
  管理区域: 執務スペース内の施錠できる書庫
  取扱区域: 本社の事務所全体

体制:
  個人情報保護管理者: 佐藤 花子
  個人情報保護管理者の所属・職名: 管理部 部長
  個人情報保護監査責任者: 鈴木 一郎
  代行者: 田中 次郎
  情報システム担当者: 高橋 三郎

文書:
  制定日: 2026-11-01
  文書番号の接頭辞: PMS

# 既定値から変える項目だけを書きます。
運用:
  記録の保存期間: 3年
  # 事故の報告先は、自社を審査した審査機関（JIPDEC 又は指定審査機関）です。
  # 申請先の最新の案内を確認して書きます。
  審査機関への事故の報告先: 当社を審査した審査機関の事故報告の窓口
  審査機関への事故の報告期限: 審査機関の案内に定める期限
  事故の報告の手引き: 審査機関と JIPDEC の最新の案内

選択:
  第三者提供: しない
  共同利用: しない
  外国にある第三者への提供: しない
  外国でのデータの保管: しない
  Cookieなどの外部送信: あり
  匿名加工情報・仮名加工情報: 扱わない
  認定個人情報保護団体: 加入していない
  手数料: なし
  # 執務スペースと来訪者の対応場所が仕切られていない場合は「なし」
  事務所の仕切り: なし

# 省略すると、ひな形の既定の一覧を使います。
利用目的:
  - 区分: お客様・取引先の担当者
    個人情報: 氏名、会社名、部署、役職、連絡先
    目的:
      - 契約の締結と履行
      - サービスの提供とサポート
      - 請求と支払
  - 区分: 採用に応募された方
    個人情報: 氏名、連絡先、学歴・職歴、応募書類の記載事項
    目的:
      - 採用選考
      - 選考結果などのご連絡
  - 区分: 委託を受けて取り扱う個人情報
    個人情報: 委託元との契約で定めるもの
    目的:
      - 委託元との契約で定める業務の遂行
    保有個人データ: false

# Cookieなどの外部送信が「あり」の場合に書きます。
外部送信:
  - 送信先: アクセス解析サービスの提供者
    送信する情報: 閲覧したページ、端末の種類、Cookie の識別子
    目的: アクセス状況の分析
