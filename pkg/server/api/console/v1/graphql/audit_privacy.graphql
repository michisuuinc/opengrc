# Japanese PrivacyMark internal audit report (内部監査報告書): the scope,
# criteria, auditors, audited departments and overall opinion of an audit,
# the category and basis of its findings, and the report's Excel export.

enum FindingPrivacyCategory
    @goModel(model: "go.probo.inc/probo/pkg/coredata.FindingPrivacyCategory") {
    NONCONFORMITY
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.FindingPrivacyCategoryNonconformity"
        )
    OBSERVATION
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.FindingPrivacyCategoryObservation"
        )
    IMPROVEMENT_OPPORTUNITY
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.FindingPrivacyCategoryImprovementOpportunity"
        )
}

type AuditPrivacyDetails {
    scope: String!
    criteria: String!
    auditeeDepartments: [String!]!
    externalAuditors: [String!]!
    overallOpinion: String!
    updatedAt: Datetime
}

# An internal auditor who belongs to one of the audited departments.
type AuditIndependenceConflict {
    auditor: Profile!
    department: String!
}

type FindingPrivacyDetails {
    # The chosen category, or null when none was chosen.
    category: FindingPrivacyCategory
    # The chosen category, or the one the finding kind falls into.
    effectiveCategory: FindingPrivacyCategory
    basis: String!
    updatedAt: Datetime
}

extend type Mutation {
    updateAuditPrivacyDetails(
        input: UpdateAuditPrivacyDetailsInput!
    ): UpdateAuditPrivacyDetailsPayload!
    updateFindingPrivacyDetails(
        input: UpdateFindingPrivacyDetailsInput!
    ): UpdateFindingPrivacyDetailsPayload!
    exportAuditReport(input: ExportAuditReportInput!): ExportAuditReportPayload!
}

# Replaces every report item and the internal auditors of the audit.
input UpdateAuditPrivacyDetailsInput {
    auditId: ID!
    scope: String!
    criteria: String!
    auditeeDepartments: [String!]!
    externalAuditors: [String!]!
    overallOpinion: String!
    auditorIds: [ID!]!
}

type UpdateAuditPrivacyDetailsPayload {
    audit: Audit!
}

# Replaces the internal audit items of the finding.
input UpdateFindingPrivacyDetailsInput {
    findingId: ID!
    category: FindingPrivacyCategory
    basis: String!
}

type UpdateFindingPrivacyDetailsPayload {
    finding: Finding!
}

input ExportAuditReportInput {
    auditId: ID!
}

type ExportAuditReportPayload {
    # The .xlsx workbook as a data URL.
    data: String!
}
