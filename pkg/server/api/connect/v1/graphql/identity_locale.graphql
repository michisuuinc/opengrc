# Fork: the language the person uses in the console, saved so that emails
# reach them in it. Values are short tags such as "ja" or "en".

extend type Mutation {
  updateViewerLocale(
    input: UpdateViewerLocaleInput!
  ): UpdateViewerLocalePayload @authentication(required: PRESENT) @sessionOnly
}

input UpdateViewerLocaleInput {
  locale: String!
}

type UpdateViewerLocalePayload {
  identity: Identity!
}
