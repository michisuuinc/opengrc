# Fork-only overrides for local development (not for production). A bare
# `docker compose` merges this file into compose.yaml automatically. The make
# targets pass `-f compose.yaml`, which turns that off, so use:
#   make stack-up DOCKER_COMPOSE_FLAGS="-f compose.override.yaml"
services:
  chrome:
    image: "opengrc/chrome-ja:local"
    build:
      context: "compose/chrome-ja"
    pull_policy: build
